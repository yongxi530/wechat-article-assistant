[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-article-assistant"
version = "1.0.0"
description = "微信公众号文章采集助手 - 高效采集和下载公众号文章"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "yongxi530"}]
keywords = ["wechat", "article", "crawler", "spider"]

dependencies = [
    "Flask>=3.0.0",
    "SQLAlchemy>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "Werkzeug>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.9.0",
]

[project.urls]
Homepage = "https://github.com/yongxi530/wechat-article-assistant"
Repository = "https://github.com/yongxi530/wechat-article-assistant"
Issues = "https://github.com/yongxi530/wechat-article-assistant/issues"

[tool.setuptools]
packages = ["wechat_article_assistant"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]